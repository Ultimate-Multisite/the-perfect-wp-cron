name: Asset build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-assets:
    name: Build production assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
